groups:
  - name: inference.vllm
    interval: 1m
    rules:
      # Peak memory of the vllm container per pod. The container matcher is what
      # makes this rule depend on k8s_container_name being present.
      - record: inference:vllm_memory_bytes:max
        expr: |
          max by (k8s_namespace_name, k8s_pod_name) (
            process_memory_usage_bytes{job="vllm", k8s_container_name="vllm"}
          )

      - alert: VLLMMemoryHigh
        expr: inference:vllm_memory_bytes:max > 12e9
        for: 10m
        labels:
          severity: page
          team: inference
        annotations:
          summary: "vLLM memory is high in {{ $labels.k8s_namespace_name }}/{{ $labels.k8s_pod_name }}"
