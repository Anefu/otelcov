            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.container.name=vllm,k8s.pod.uid=$(POD_UID)
        - name: log-shipper
          image: fluent/fluent-bit:4.0
