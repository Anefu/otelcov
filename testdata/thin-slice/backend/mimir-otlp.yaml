# Mimir per-tenant limits that decide how OTLP data becomes Prometheus series.
# The backend node reads only these two settings.
limits:
  # Resource attributes that become labels. Everything else on the resource
  # ends up on target_info only.
  promote_otel_resource_attributes: "k8s.namespace.name,k8s.pod.name,k8s.container.name,k8s.node.name"

  # Adds unit/type suffixes: process.memory.usage (unit By) -> process_memory_usage_bytes.
  # NOTE: setting name not verified against current Mimir docs; check it for your
  # version (newer releases may express this as a translation strategy instead).
  otel_metric_suffixes_enabled: true
