# What "covered" means for this slice (format A, see AGENTS.md, Requirements).
# The forward check: for every matching pod, is there a path from the pod's
# signal to the alert, and from the alert to the receiver?
requirements:
  - id: vllm-memory-watched
    description: Every vLLM pod's memory is watched by VLLMMemoryHigh, which pages the inference team and says which pod.
    subjects:
      kind: pod
      namespace: inference
      labels:
        app.kubernetes.io/name: vllm
      container: vllm                  # the container expected to send it
    signal:
      metrics: [process.memory.usage]  # OTel names, as recorded; any of them counts
    reaches:
      - alert: VLLMMemoryHigh
        receivers: [inference-pager]
        labels: [k8s_pod_name]         # the alert must say which pod
