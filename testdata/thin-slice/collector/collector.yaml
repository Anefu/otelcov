# Staging collector config. Two pipelines share the same receiver:
#   metrics      - the real pipeline; the checker models its processors as graph nodes
#   metrics/tap  - writes raw input to disk; this is how recordings/ is produced
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  k8sattributes:
    auth_type: serviceAccount
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.container.name

  batch: {}

  # Tap only. A file can't hold the client connection, so without this a replayed
  # recording could no longer be associated with its pod. Passthrough mode only
  # records k8s.pod.ip from the connection and adds nothing else.
  k8sattributes/tap:
    passthrough: true

exporters:
  otlphttp/mimir:
    endpoint: http://mimir-distributor.observability:8080/otlp

  file/tap:
    path: /var/lib/otel-tap/metrics.otlp.jsonl
    format: json
    rotation:
      max_megabytes: 100
      max_days: 3
      max_backups: 20

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [k8sattributes, batch]
      exporters: [otlphttp/mimir]
    metrics/tap:
      receivers: [otlp]
      processors: [k8sattributes/tap]
      exporters: [file/tap]
