# The agent daemonset. Its config is the otel-agent-config ConfigMap, made by
# the Tiltfile from config/agent.yaml (or the --agent variant).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  namespace: observability
---
# What k8sattributes needs to look up pods and their owners.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent
subjects:
  - kind: ServiceAccount
    name: otel-agent
    namespace: observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-agent
    spec:
      serviceAccountName: otel-agent
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.134.1
          args: ["--config=/conf/agent.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Read by resourcedetection's env detector: a per-node value.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: host.name=$(K8S_NODE_NAME),deployment.environment.name=kind
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: conf, mountPath: /conf}
            - {name: tap, mountPath: /tap}
        # The collector image has no shell, so capture.sh reads the recordings
        # through this container.
        - name: tap-reader
          image: busybox:1.37
          command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 1; done"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
          volumeMounts:
            - {name: tap, mountPath: /tap, readOnly: true}
      volumes:
        - name: conf
          configMap:
            name: otel-agent-config
        - name: tap
          emptyDir: {}
---
# Apps send to the agent on their own node: internalTrafficPolicy Local, and
# no SNAT, so the agent sees the sender's pod IP.
apiVersion: v1
kind: Service
metadata:
  name: otel-agent
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: otel-agent
  internalTrafficPolicy: Local
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
